# Replace OWNER after creating the GitHub repository.
substitutions:
  device_name: streamdeck-poc

esphome:
  name: ${device_name}
  friendly_name: Stream Deck PoC

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  # Use the separate USB-UART port for logs while native USB is host.
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: StreamDeck-PoC-Fallback
    password: !secret fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: git
      url: https://github.com/OWNER/esphome-streamdeck-poc
      ref: main
    components: [streamdeck_poc]
    refresh: 0s

streamdeck_poc:
  id: streamdeck
